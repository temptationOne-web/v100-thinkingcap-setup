# /etc/systemd/system/1cat-ornith-brain.service.d/60-nosync.conf  -- STAGED 2026-10-30 night, NOT installed.
# TC_NOSYNC: no host<->GPU sync in the sampled (temperature > 0) top-k/top-p route -> the host can run ahead of the GPU.
# Code: /opt/1cat/tcflash-trial/next-tps/ext/tc_nosync.py (+ tc_nosync_ext.py). No compile change: keeps cache-ab.
# Chain: run-tc-prod.sh WEXT=tc_prod_ext.TCProdExt -> TC_BASE_EXT=tc_nosync_ext.TCNoSyncExt -> tc_ext.TCExt (as today).
# Verify after boot (prod log, every rank): "TC-NOSYNC pid N: installed=True" and later "status {... nosync_calls ...}".
# Rollback: sudo rm this file && sudo systemctl daemon-reload && sudo systemctl restart 1cat-ornith-brain
[Service]
Environment=TC_NOSYNC=1 TC_BASE_EXT=tc_nosync_ext.TCNoSyncExt PYTHONPATH=/opt/1cat/tcflash-trial/next-tps/ext
