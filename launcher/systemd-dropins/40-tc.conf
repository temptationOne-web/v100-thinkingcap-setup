# /etc/systemd/system/1cat-ornith-brain.service.d/40-tc.conf  -- ThinkingCap go-live drop-in (prepared 2026-10-26, NOT installed)
# Installed by /opt/1cat/tcflash-trial/golive/golive.sh. Rollback: bash /opt/1cat/tcflash-trial/golive/rollback.sh
# (= remove this file + /opt/1cat/TC_PROD, daemon-reload, ornith-up.sh). Ornith's 10-ldpath/20-cache/30-pf drop-ins stay
# untouched: the empty ExecStartPre= below clears 20-cache.conf's cache-snap-P copy steps (and the base unit's GPU-free
# check, which is re-added). ORN_CACHE_ROOT / ENVF / TAG from the other drop-ins are ignored by run-tc-prod.sh.
# Kept from Ornith: unit name (watchdogs, brain_warmup, queue_watchdog key on it), /opt/1cat/ORNITH_PROD condition,
# log ornith-prod.log (StandardOutput; run-tc-prod.sh also tees to tcflash-trial/logs/prod-*.log), LD_LIBRARY_PATH
# (10-ldpath = cuBLAS 12.9.2.10 path, same as the trial processes), Restart=always, OOMScoreAdjust -800, LimitMEMLOCK.
[Service]
ExecStartPre=
ExecStartPre=/bin/bash -c 'for i in $(seq 1 60); do [ -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader)" ] && exit 0; sleep 5; done; echo "GPUs busy"; exit 1'
ExecStartPre=/bin/mkdir -p /opt/1cat/tcflash-trial/cache-tcprod /opt/1cat/tcflash-trial/logs
# Frozen compile snapshot (after a passing trial boot: cp -a cache-tcprod cache-snap-TC1; see README "snapshot"). Enable by
# un-commenting these three lines (copy on every start, like Ornith's 20-cache.conf):
#ExecStartPre=/bin/rm -rf /opt/1cat/tcflash-trial/cache-tcprod
#ExecStartPre=/bin/cp -a /opt/1cat/tcflash-trial/cache-snap-TC1 /opt/1cat/tcflash-trial/cache-tcprod
#ExecStartPre=/bin/chmod -R u+w /opt/1cat/tcflash-trial/cache-tcprod
Environment=TC_CACHE_ROOT=/opt/1cat/tcflash-trial/cache-tcprod TC_PROD_KVOFF_GB=0
# JSON rule R9 (structured outputs never draft): only if the JSON gate shows grammar 500s. Un-comment:
#Environment=TC_SO_NODRAFT=1
# 2026-10-27 UPGRADE 1: tc_glue fused AR+HC combine+RMSNorm (ext/tc_glue.py via tc_ext.py). Off = delete/comment this line.
Environment=TC_GLUE=1
# 2026-10-27 TOOLFIX: qwen3_coder_tcfix parser plugin (ext/tc_toolfix.py; streamed no-arg tools "{" under load). Off = 0.
Environment=TC_TOOLFIX=1
ExecStart=
ExecStart=/bin/bash /opt/1cat/tcflash-trial/run-tc-prod.sh
# ~7 min warm boot (trial var-final); the base TimeoutStartSec=900 is irrelevant for Type=simple but keep stop time:
TimeoutStopSec=180
# 2026-10-26: hybrid PLE pins ~63 GiB; 16 GiB RAM cache hit the 95G trial cap. Cap the brain so it can never take the rig down.
MemoryMax=110G
MemorySwapMax=0
# Optional OOM fence (owner choice; SWITCH-PLAN section 3): a runaway kills+restarts the brain, not the box.
#MemoryMax=100G
